<style>
:root{--bg:#0a0e1a;--g:rgba(255,255,255,.09);--gb:rgba(255,255,255,.2);--tx:#f2f4fa;--mu:#9aa3b8;--ac:#6ea8ff;--ok:#30d158;--no:#ff453a;--l:#ffffff14;--l2:#ffffff30;--f:rgba(255,255,255,.08);--f2:rgba(255,255,255,.15);--on:#04122b;--sh:rgba(32,36,56,.9);--b1:#2c4fa877;--b2:#7a3aa866;--shd:#0006;--hi:#ffffff33;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(520px 420px at 12% 8%,var(--b1),transparent),radial-gradient(560px 520px at 92% 85%,var(--b2),transparent),var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
h1{font-size:34px;margin:18px 4px 12px}h3{margin:0 0 6px}h4{margin:18px 10px 6px;color:var(--mu);font-weight:600;font-size:14px}
#v{height:100%;overflow-y:auto;padding:0 14px 120px}
.gl{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-radius:24px;box-shadow:0 10px 30px var(--shd),inset 0 1px 0 var(--hi)}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;z-index:5;border-radius:34px}
#nav button{background:none;border:0;color:var(--mu);padding:8px 18px;border-radius:28px;font-size:12px;display:flex;flex-direction:column;align-items:center}

#ov,#md{position:fixed;inset:0;z-index:10}
#ov{background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
#md{background:rgba(0,0,0,.55);display:flex;z-index:12}
.sh{width:100%;max-width:520px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--sh);max-height:92%;overflow:auto}
.sh label{display:block;margin-top:10px;color:var(--mu);font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:600}
.cn{min-width:52px;text-align:right}
.pb{height:4px;background:var(--l2);border-radius:2px}.pb i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
.ib{width:52px;height:52px;border-radius:50%;color:var(--tx);font-size:20px;padding:0}.ib.on{background:var(--ac);color:var(--on)}.ib.ok{color:var(--ok)}.ib.no{color:var(--no)}
.big2{width:88px;height:88px;font-size:36px;margin:auto}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0}
.c{text-align:center}.p{padding:18px}
.fc{min-height:52%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s,background .2s;padding:16px;text-align:center}
.w1{font-size:42px;font-weight:800}.w2{font-size:26px;color:var(--mu)}
.ft{display:flex;justify-content:space-around;padding:16px 0}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.an{min-height:96px;color:var(--tx);font-size:17px;padding:8px;transition:background .2s}
.g{background:rgba(48,209,88,.42)!important;border-color:var(--ok)!important}.r{background:rgba(255,69,58,.42)!important;border-color:var(--no)!important}
.qq{text-align:center;font-size:34px;font-weight:800;min-height:88px;display:grid;place-items:center}
.big{display:block;width:100%;text-align:left;padding:18px 20px;margin:12px 0;color:var(--tx);font-size:20px;font-weight:700}
.big b{font-size:26px;margin-right:10px}.big small{display:block;color:var(--mu);font-weight:400;font-size:13px;margin-top:4px}
.bt{background:var(--ac);color:var(--on);border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;width:100%;margin-top:14px}.bt.dn{background:var(--no);color:#fff}
.in{width:100%;background:var(--f);border:1px solid var(--gb);border-radius:14px;padding:12px;color:var(--tx);font:inherit;margin:4px 0}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--l);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform 2s linear}
.row.pr{transform:scale(.96)}.row>div{flex:1}.row small,.mu{color:var(--mu)}
.rg{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--l2) 0)}
.sp{background:none;border:0;font-size:20px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.ch button{white-space:nowrap;background:var(--g);border:1px solid var(--gb);color:var(--tx);border-radius:16px;padding:8px 14px}.ch .on{background:var(--ac);color:var(--on)}
.th{display:flex;justify-content:space-between;align-items:center}
.st{display:flex;justify-content:space-around;padding:16px;text-align:center;color:var(--mu);font-size:13px}.st b{display:block;font-size:24px;color:var(--tx)}
.sr{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--l)}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px}.sr .sw,.sr select{margin-left:auto}
.sw{position:relative;width:52px;height:30px}.sw input{opacity:0;position:absolute;inset:0;z-index:1;margin:0}
.sw i{position:absolute;inset:0;background:var(--l2);border-radius:15px;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{left:25px}
select{background:none;color:var(--mu);border:0;font-size:16px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--l);color:var(--tx);padding:14px 4px;font-size:17px}.mi.dn{color:var(--no)}
.rw{display:flex;gap:10px}
.pg{flex:1;min-height:0;padding:12px 0}.pc{display:flex;flex-direction:column;gap:10px;min-height:0}
.pp{flex:1;min-height:52px;min-width:0;font-size:15px}.sel{background:rgba(110,168,255,.38)!important;border-color:var(--ac)!important}
.wh{position:relative;height:230px;overflow:hidden;perspective:600px}
.wb{position:absolute;left:8px;right:8px;top:50%;height:46px;margin-top:-23px;border-radius:14px;background:var(--f2);pointer-events:none}
.wi{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-23px;display:flex;align-items:center;justify-content:center;padding:0 16px;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden}
.fo{display:grid;grid-template-columns:52px 1fr 52px;gap:12px;align-items:center}.fo .bt{margin:0}
.hs{font-size:22px;letter-spacing:2px}.hp{display:inline-block}.hp.lost{visibility:hidden}.hp.pop{animation:pop .55s forwards}
@keyframes pop{40%{transform:scale(1.7)}100%{transform:scale(0);opacity:0}}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hb{background:var(--g);border:1px solid var(--gb);border-radius:16px;padding:8px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:4px;height:124px}
.hb.on{border-color:var(--ac);background:var(--f2)}.hb img{height:84px;max-width:100%;object-fit:contain}.hb span{font-size:56px;line-height:84px}.hb small{font-size:12px}
#cv{flex:1;min-height:0;width:100%;display:block;border-radius:24px;touch-action:none}
.sc{padding:8px 18px;border-radius:16px;font-weight:700;font-size:20px}.ubn{padding:10px 14px;text-align:center;margin:6px 0}
#ts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;padding:10px 18px;border-radius:20px;background:var(--sh);opacity:0;pointer-events:none;transition:.3s;text-align:center;max-width:90%}#ts.show{opacity:1}
html[data-th=light]{--bg:#eef1f8;--g:rgba(255,255,255,.65);--gb:rgba(20,30,60,.1);--tx:#12172a;--mu:#5d667c;--ac:#2f6df6;--ok:#1fa64a;--no:#e5372e;--l:#0000001a;--l2:#00000026;--f:rgba(0,0,0,.05);--f2:rgba(0,0,0,.09);--on:#fff;--sh:rgba(250,251,255,.94);--b1:#9dbcff99;--b2:#f5b8e699;--shd:#1a2a5a26;--hi:#fffc;color-scheme:light}
html[data-th=lilac]{--bg:#140d24;--g:rgba(190,150,255,.12);--gb:rgba(210,180,255,.26);--tx:#f4eeff;--mu:#b0a3cc;--ac:#c08bff;--ok:#5ee08a;--no:#ff5e78;--on:#1c0f33;--sh:rgba(38,24,64,.93);--b1:#8a3ff077;--b2:#d86bd066}
html[data-th=ocean]{--bg:#04141f;--g:rgba(120,200,255,.1);--gb:rgba(140,215,255,.25);--tx:#eaf8ff;--mu:#8fb3c4;--ac:#3ec6e0;--ok:#3ddc97;--no:#ff6b6b;--on:#03202c;--sh:rgba(8,36,54,.93);--b1:#0a6ea877;--b2:#0c9a9a66}
</style></head><body>
<div id="v"></div><nav id="nav" class="gl"></nav><div id="ov" hidden></div><div id="md" hidden></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),K='flashcards_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{decks:[],cur:null,tab:'home',day:'',done:0,set:{st:1,sv:0,both:0,shc:1,shs:0,sw:0,tt:3,tv:3,max:50,srs:1,vl:'en-US'}};
const C=S.set,save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
C.th??='dark';C.lg??='ru';C.nf??=0;C.nn??=3;C.fx??=20;C.ch??=0;C.nt??=['09:00','13:00','17:00','20:00','11:00','22:00'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
uid=()=>Math.random().toString(36).slice(2,9),
shuf=a=>{a=[...a];for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a},
all=()=>S.decks.flatMap(d=>d.cards),hard=()=>all().filter(c=>c.hard),
deck=()=>S.cur=='hard'?null:S.decks.find(d=>d.id==S.cur),
cards=()=>S.cur=='hard'?hard():(deck()?.cards||[]),
rnd=()=>(C.sw?1:0)^(C.shs&&Math.random()<.5?1:0);
if(S.day!=new Date().toDateString()){S.day=new Date().toDateString();S.done=0}
const EN={'Главная':'Home','Карточки':'Cards','Настройки':'Settings','Пока нет колод. Создайте первую в разделе «Карточки».':'No decks yet. Create your first one in “Cards”.','Перейти к карточкам':'Go to cards','карточек':'cards','к повторению':'due','сегодня':'today','Учить':'Learn','вправо — выучено, влево — в «Трудные слова»':'swipe right: learned, left: “Hard words”','Аудио викторина':'Audio quiz','слушайте слово и выбирайте перевод':'listen and pick the translation','Тест':'Test','выберите правильный перевод':'choose the correct translation','Пары':'Pairs','соедините слово с переводом':'match each word with its translation','Трудные слова':'Hard words','Готово':'Done','Пройдено карточек:':'Cards completed:','Результат:':'Result:','Ещё раз':'Again','Закрыть':'Close','Ошибок:':'Mistakes:','Все карточки':'All cards','Здесь появятся ваши слова.':'Your words will appear here.','Добавить колоду':'Add deck','Поиск карточек':'Search cards','Удерживайте карточку 2 секунды — откроется редактирование':'Hold a card for 2 seconds to edit it','Ничего не найдено':'Nothing found','Редактировать карточку':'Edit card','Термин':'Term','Значение':'Meaning','Заметки':'Notes','Прогресс:':'Progress:','Сохранить':'Save','Удалить карточку?':'Delete this card?','Удалить':'Delete','Отмена':'Cancel','Да':'Yes','Меню':'Menu','Добавить слова в колоду':'Add words to deck','Переименовать колоду':'Rename deck','Сбросить прогресс колоды':'Reset deck progress','Удалить колоду':'Delete deck','Новая колода':'New deck','Добавить слова':'Add words','Добавить':'Add','Название колоды':'Deck name','Список 1 — английские слова, по одному в строке':'List 1 — English words, one per line','Список 2 — русские переводы в том же порядке':'List 2 — Russian translations in the same order','Создать колоду':'Create deck','Введите слова в оба списка':'Enter words in both lists','Списки разной длины:':'Lists differ in length:','Нужно минимум 2 карточки':'At least 2 cards are needed','В колоде нет карточек':'This deck has no cards','Лимит на сегодня достигнут — увеличьте его в настройках':'Daily limit reached — raise it in Settings','На сегодня всё повторено':'All reviewed for today','Выберите обычную колоду, а не «Трудные слова»':'Choose a regular deck, not “Hard words”','Настройки обучения':'Study settings','Озвучить термин':'Speak term','Озвучить значение':'Speak meaning','Показать обе стороны':'Show both sides','Перемешать карточки':'Shuffle cards','Перемешать стороны':'Shuffle sides','Поменять стороны':'Swap sides','Автопереход (кнопка ▶ в режиме «Учить»)':'Auto-advance (▶ button in “Learn”)','Время на термин':'Time per term','Время на значение':'Time per meaning','На сегодня':'Today','Максимум в день':'Max per day','Алгоритм':'Algorithm','Интервальное повторение':'Spaced repetition','Языки':'Languages','Озвучка английского':'English voice','Оформление':'Appearance','Закрепление':'Reinforce','повторяйте слова, пока не запомните':'repeat words until they stick','Фортуна':'Fortune','крутите колесо и введите перевод':'spin the wheel and type the translation','Крутить':'Spin','Проверить':'Check','Введите перевод':'Type the translation','Начать':'Start','Запомните эти слова':'Memorize these words','Слов в закреплении':'Words per Reinforce session','Закреплено слов:':'Words reinforced:','Игра окончена':'Game over','Верных ответов:':'Correct answers:','Играть снова':'Play again','Новые слова':'New words','Герой':'Hero','Вбеги в правильный ответ':'Run into the right answer','бегите в полосу с верным ответом':'run into the lane with the right answer','Очки:':'Score:','Рекорд:':'Best:','Верно:':'Correct:','Пауза':'Paused','Продолжить':'Resume','Выйти':'Quit','Тема':'Theme','Тёмная':'Dark','Светлая':'Light','Сиреневая':'Lilac','Морская':'Ocean','Язык сайта':'Site language','Уведомления':'Notifications','Включить напоминания':'Enable reminders','Раз в день':'Times per day','Напоминание':'Reminder','Проверить уведомление':'Test notification','Пора повторить слова':'Time to review your words','К повторению':'Due','Загляните в карточки':'Open your cards','Напоминания включены':'Reminders are on','Разрешите уведомления в браузере':'Allow notifications in the browser','Уведомления не поддерживаются, напоминания будут показаны внутри сайта':'Notifications aren’t supported here; reminders will show inside the site','Напоминания приходят, пока сайт открыт в браузере или приложении на экране «Домой».':'Reminders arrive while the site is open in the browser or as a Home Screen app.'},
KS=Object.keys(EN).filter(k=>k.length>5).sort((a,b)=>b.length-a.length),
tx=t=>{const k=t.trim();if(EN[k])return t.replace(k,EN[k]);for(const r of KS)t=t.split(r).join(EN[r]);return t},
tr=h=>C.lg=='en'?h.replace(/>([^<]+)/g,(m,t)=>'>'+tx(t)).replace(/placeholder="([^"]+)"/g,(m,t)=>'placeholder="'+tx(t)+'"'):h;
function toast(m){const t=$('#ts');t.textContent=C.lg=='en'?tx(m):m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)}
function say(t,l,q){try{if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const sayT=(c,q)=>say(c.t,C.vl,q),sayV=(c,q)=>say(c.v,'ru-RU',q),
spk=(c,x,q)=>{if(C[x=='t'?'st':'sv'])(x=='t'?sayT:sayV)(c,q)};
function modal(h){const m=$('#md');m.innerHTML='<div class="sh gl">'+tr(h)+'</div>';m.hidden=false;m.onclick=e=>{if(e.target==m)closeM()}}
const closeM=()=>$('#md').hidden=true;
function sure(t,f){modal(`<h3>${t}</h3><div class="rw"><button class="bt" onclick="closeM()">Отмена</button><button class="bt dn" id="yes">Да</button></div>`);$('#yes').onclick=()=>{closeM();f()}}
function render(){
 if(S.cur=='hard'&&!hard().length||S.cur!='hard'&&!deck())S.cur=S.decks[0]?.id||null;
 document.documentElement.dataset.th=C.th;document.documentElement.lang=C.lg;$('#nav').innerHTML=tr([['home','🏠','Главная'],['cards','🗂','Карточки'],['set','⚙️','Настройки']].map(([k,i,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()"><b>${i}</b>${n}</button>`).join(''));
 $('#v').innerHTML=tr(({home:vHome,cards:vCards,set:vSet})[S.tab]());save()}
const chips=()=>`<div class="ch">${S.decks.map(d=>`<button class="${d.id==S.cur?'on':''}" onclick="S.cur='${d.id}';render()">${esc(d.name)}</button>`).join('')}${hard().length?`<button class="${S.cur=='hard'?'on':''}" onclick="S.cur='hard';render()">🔥 Трудные слова (${hard().length})</button>`:''}</div>`;
function vHome(){
 if(!S.decks.length)return`<h1>Главная</h1><div class="gl p c"><p>Пока нет колод. Создайте первую в разделе «Карточки».</p><button class="bt" onclick="S.tab='cards';render()">Перейти к карточкам</button></div>`;
 const cs=cards(),due=C.srs?cs.filter(c=>!c.due||c.due<=Date.now()).length:cs.length;
 return`<h1>Главная</h1>${chips()}<div class="gl st"><div><b>${cs.length}</b>карточек</div><div><b>${due}</b>к повторению</div><div><b>${S.done}/${C.max}</b>сегодня</div></div>
<button class="big gl" onclick="learn()"><b>📖</b>Учить<small>вправо — выучено, влево — в «Трудные слова»</small></button>
<button class="big gl" onclick="quiz(1)"><b>🔊</b>Аудио викторина<small>слушайте слово и выбирайте перевод</small></button>
<button class="big gl" onclick="quiz(0)"><b>✍️</b>Тест<small>выберите правильный перевод</small></button>
<button class="big gl" onclick="pairs()"><b>🧩</b>Пары<small>соедините слово с переводом</small></button>
<button class="big gl" onclick="fix()"><b>🎯</b>Закрепление<small>повторяйте слова, пока не запомните</small></button>
<button class="big gl" onclick="fort()"><b>🎡</b>Фортуна<small>крутите колесо и введите перевод</small></button>
<button class="big gl" onclick="sub()"><b>🏃</b>Flip Subway<small>бегите в полосу с верным ответом</small></button>`}
function grade(c,ok,cnt){c.reps=ok?(c.reps||0)+1:0;c.prog=Math.min(100,Math.round(c.reps/6*100));c.due=ok&&C.srs?Date.now()+[1,3,7,14,30,60][Math.min(c.reps-1,5)]*864e5:0;c.hard=ok?0:1;if(cnt)S.done++;save()}
/* ---- учить ---- */
let Q=[],qi=0,fl=0,ap=0,T0=0;
const hdr=(t,n,N)=>`<div class="hd"><button class="ib gl" onclick="closeOv()">✕</button><span>${t}</span><span class="cn">${n} / ${N}</span></div><div class="pb"><i style="width:${N?n/N*100:0}%"></i></div>`,
ovShow=h=>{const o=$('#ov');o.innerHTML=tr(h);o.hidden=false};
function closeOv(){clearTimeout(T0);ap=0;try{speechSynthesis.cancel()}catch(e){}$('#ov').hidden=true;render()}
function learn(){let q=cards().filter(c=>!C.srs||!c.due||c.due<=Date.now());if(C.shc)q=shuf(q);Q=q.slice(0,Math.max(0,C.max-S.done));qi=0;
 if(!Q.length)return toast(!cards().length?'В колоде нет карточек':S.done>=C.max?'Лимит на сегодня достигнут — увеличьте его в настройках':'На сегодня всё повторено');lc()}
function lc(){
 clearTimeout(T0);
 if(qi>=Q.length)return ovShow(hdr('Учить',qi,Q.length)+`<div class="mid c"><h2>Готово 🎉</h2><p class="mu">Пройдено карточек: ${Q.length}</p><button class="bt" onclick="closeOv()">Закрыть</button></div>`);
 const c=Q[qi],r=rnd(),f=r?'v':'t',b=r?'t':'v';fl=0;
 ovShow(hdr('Учить',qi,Q.length)+`<div class="mid"><div class="fc gl" id="fc"><div class="w1">${esc(c[f])}</div><div class="w2" id="w2"></div></div></div><div class="ft"><button class="ib gl" onclick="sayT(Q[qi])">🔊</button><button class="ib gl no" onclick="dec(0)">✕</button><button class="ib gl ok" onclick="dec(1)">✓</button><button class="ib gl ${ap?'on':''}" onclick="ap=!ap;lc()">▶</button></div>`);
 const e=$('#fc'),rv=on=>{fl=on??!fl;$('#w2').textContent=fl?c[b]:'';if(fl)spk(c,b,1)};
 spk(c,f);if(C.both)rv(1);
 if(ap)T0=setTimeout(()=>{rv(1);T0=setTimeout(()=>{qi++;lc()},C.tv*1000)},C.tt*1000);
 let x0=0,dx=0,dn=0;
 e.onpointerdown=v=>{dn=1;x0=v.clientX;e.setPointerCapture(v.pointerId);e.style.transition='none'};
 e.onpointermove=v=>{if(!dn)return;dx=v.clientX-x0;e.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;e.className='fc gl'+(dx>40?' g':dx<-40?' r':'')};
 e.onpointerup=()=>{if(!dn)return;dn=0;if(Math.abs(dx)>90)dec(dx>0?1:0);else{e.style.transition='';e.style.transform='';e.className='fc gl';if(Math.abs(dx)<8)rv()}dx=0}}
function dec(ok){const e=$('#fc');if(e.dataset.d)return;e.dataset.d=1;clearTimeout(T0);e.style.transition='transform .3s';e.className='fc gl '+(ok?'g':'r');e.style.transform=`translateX(${ok?600:-600}px) rotate(${ok?30:-30}deg)`;grade(Q[qi],ok,1);setTimeout(()=>{qi++;lc()},280)}
/* ---- тест и аудио викторина ---- */
let Z=[],zi=0,zs=0,au=0;
function quiz(a){au=a;if(cards().length<2)return toast('Нужно минимум 2 карточки');Z=shuf(cards()).slice(0,20);zi=0;zs=0;qz()}
function qz(){
 const ti=au?'Аудио викторина':'Тест';
 if(zi>=Z.length)return ovShow(hdr(ti,zi,Z.length)+`<div class="mid c"><h2>Результат: ${zs} / ${Z.length}</h2><button class="bt" onclick="quiz(${au})">Ещё раз</button><button class="bt gl" style="color:var(--tx)" onclick="closeOv()">Закрыть</button></div>`);
 const c=Z[zi],r=au?0:rnd(),q=r?'v':'t',a=r?'t':'v',pool=cards().length>=4?cards():all(),
 o=shuf([c,...shuf(pool.filter(x=>x!=c&&x[a]!=c[a])).slice(0,3)]);
 ovShow(hdr(ti,zi,Z.length)+`<div class="mid"><div class="qq"${au?'':` onclick="${r?'sayV':'sayT'}(Z[zi])"`}>${au?'<button class="ib gl big2" onclick="sayT(Z[zi])">🔊</button>':esc(c[q])}</div><div class="gr" id="gr">${o.map(x=>`<button class="an gl">${esc(x[a])}</button>`).join('')}</div></div>`);
 if(au)sayT(c);else(r?sayV:sayT)(c);
 const bs=[...document.querySelectorAll('.an')];
 bs.forEach((b,i)=>b.onclick=()=>{const g=$('#gr');if(g.dataset.d)return;g.dataset.d=1;const ok=o[i]==c;b.classList.add(ok?'g':'r');if(!ok)bs[o.indexOf(c)].classList.add('g');if(ok)zs++;grade(c,ok,0);if(a=='t')sayT(c);setTimeout(()=>{zi++;qz()},ok?800:1400)})}
/* ---- пары ---- */
let P=[],pi=0,pm=0,pe=0;
function pairs(){if(cards().length<2)return toast('Нужно минимум 2 карточки');P=shuf(cards());pi=0;pm=0;pe=0;pr()}
function pr(){
 const ch=P.slice(pi,pi+6),N=P.length;
 if(!ch.length)return ovShow(hdr('Пары',pm,N)+`<div class="mid c"><h2>Готово 🎉</h2><p class="mu">Ошибок: ${pe}</p><button class="bt" onclick="pairs()">Ещё раз</button><button class="bt gl" style="color:var(--tx)" onclick="closeOv()">Закрыть</button></div>`);
 const a=C.sw?'v':'t',b=C.sw?'t':'v',col=s=>`<div class="pc">${shuf(ch).map(c=>`<button class="an gl pp" data-s="${s}" data-id="${c.id}">${esc(c[s])}</button>`).join('')}</div>`;
 ovShow(hdr('Пары',pm,N)+`<div class="gr pg">${col(a)}${col(b)}</div>`);
 let sel=null,left=ch.length;
 document.querySelectorAll('.pp').forEach(x=>x.onclick=()=>{
  if(x.classList.contains('g'))return;
  const c=ch.find(k=>k.id==x.dataset.id);
  if(sel==x){x.classList.remove('sel');sel=null;return}
  if(!sel||sel.dataset.s==x.dataset.s){if(sel)sel.classList.remove('sel');sel=x;x.classList.add('sel');spk(c,x.dataset.s);return}
  const y=sel,ok=y.dataset.id==x.dataset.id;y.classList.remove('sel');sel=null;
  if(ok){[x,y].forEach(e=>e.classList.add('g'));pm++;$('.cn').textContent=pm+' / '+N;$('.pb i').style.width=pm/N*100+'%';if(!--left)setTimeout(()=>{pi+=6;pr()},700)}
  else{pe++;[x,y].forEach(e=>e.classList.add('r'));setTimeout(()=>[x,y].forEach(e=>e.classList.remove('r')),500)}
 })}
/* ---- ввод перевода (общий) ---- */
const TB='<input class="in" id="ti" placeholder="Введите перевод" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-size:20px;text-align:center"><div class="mu c" id="ta" style="min-height:24px"></div><button class="bt" id="tk" style="margin-top:0">Проверить</button>',
norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]/g,' ').replace(/\s+/g,' ').trim(),
okA=(c,s,v)=>[c[s],...c[s].split(/[,;]/)].map(norm).filter(Boolean).includes(norm(v));
function tin(c,s,res,nx){let d=0;const i=$('#ti'),go=()=>{if(d||!i.value.trim())return;d=1;const ok=okA(c,s,i.value);i.classList.add(ok?'g':'r');i.readOnly=true;if(!ok)$('#ta').textContent=c[s];if(s=='t')sayT(c);res(ok);setTimeout(nx,ok?800:1800)};
 $('#tk').onclick=go;i.onkeydown=e=>{if(e.key=='Enter')go()};i.focus()}
/* ---- закрепление ---- */
let G={};
function fix(){const l=cards();if(l.length<2)return toast('Нужно минимум 2 карточки');
 const it=shuf(l).slice(0,Math.min(C.fx,l.length)).map(c=>({c,s:0,m:0}));G={it,q:shuf(it),e:0};
 ovShow(hdr('Закрепление',0,it.length*3)+`<p class="mu c">Запомните эти слова</p><div class="gl" style="flex:1;overflow:auto;min-height:0">${it.map(x=>`<div style="padding:12px 18px;border-bottom:1px solid var(--l)"><div>${esc(x.c.t)}</div><small class="mu">${esc(x.c.v)}</small></div>`).join('')}</div><div class="ft"><button class="bt" style="margin:0" onclick="fq()">Начать</button></div>`)}
function fq(){
 const N=G.it.length*3,P0=G.it.reduce((a,x)=>a+x.s,0);
 if(!G.q.length){G.it.forEach(x=>grade(x.c,x.m<2,0));return ovShow(hdr('Закрепление',N,N)+`<div class="mid c"><h2>Готово 🎉</h2><p class="mu">Закреплено слов: ${G.it.length}</p><p class="mu">Ошибок: ${G.e}</p><button class="bt" onclick="fix()">Новые слова</button><button class="bt gl" style="color:var(--tx)" onclick="closeOv()">Закрыть</button></div>`)}
 const x=G.q.shift(),c=x.c,ty=x.s>1,r=x.s>0?1:0,q=r?'v':'t',a=r?'t':'v',
 o=ty?0:shuf([c,...shuf(all().filter(y=>y!=c&&y[a]!=c[a])).slice(0,3)]),
 upd=ok=>{if(ok)x.s++;else{x.s=Math.max(0,x.s-1);x.m++;G.e++}if(x.s<3)G.q.splice(Math.min(G.q.length,ok?2+(Math.random()*4|0):2),0,x)};
 ovShow(hdr('Закрепление',P0,N)+`<div class="mid"><div class="qq">${esc(c[q])}</div>${ty?TB:`<div class="gr" id="gr">${o.map(y=>`<button class="an gl">${esc(y[a])}</button>`).join('')}</div>`}</div>`);
 q=='t'?sayT(c):sayV(c);
 if(ty)return tin(c,a,upd,fq);
 const bs=[...document.querySelectorAll('.an')];
 bs.forEach((b,i)=>b.onclick=()=>{const g=$('#gr');if(g.dataset.d)return;g.dataset.d=1;const ok=o[i]==c;b.classList.add(ok?'g':'r');if(!ok)bs[o.indexOf(c)].classList.add('g');if(a=='t')sayT(c);upd(ok);setTimeout(fq,ok?800:1500)})}

function fort(){const l=cards();if(l.length<2)return toast('Нужно минимум 2 карточки');FO={l:shuf(l),p:0,f:'v',h:5,s:0,b:0};fr()}
function fr(){
 ovShow(`<div class="hd"><span class="hs">${[0,1,2,3,4].map(i=>`<span class="hp${i>=FO.h?' lost':''}" id="h${i}">❤️</span>`).join('')}</span><span id="sc">⭐ ${FO.s}</span><button class="ib gl" onclick="closeOv()">✕</button></div><div class="mid"><div class="wh gl"><div class="wb"></div>${'<div class="wi"></div>'.repeat(9)}</div><div id="wa"></div></div><div class="ft fo" id="fb"><span></span><button class="bt" id="sp">Крутить</button><button class="ib gl" id="sw2">🔁</button></div>`);
 wd();$('#sp').onclick=spin;$('#sw2').onclick=()=>{if(!FO.b){FO.f=FO.f=='v'?'t':'v';wd()}}}
function wd(){const n=FO.l.length,b=Math.floor(FO.p);document.querySelectorAll('.wi').forEach((e,j)=>{const k=j-4,o=b+k-FO.p,z=Math.abs(o);e.textContent=FO.l[((b+k)%n+n)%n][FO.f];e.style.transform=`translateY(${o*WH}px) rotateX(${-o*26}deg) scale(${Math.max(.5,1-z*.09)})`;e.style.opacity=Math.max(0,1-z*.3)})}
function spin(){if(FO.b)return;FO.b=1;const n=FO.l.length,t0=FO.p,g=Math.random()*n|0,d=Math.ceil(24/n)*n+(((g-t0)%n)+n)%n,s=performance.now();
 const f=now=>{const u=Math.min(1,(now-s)/3600);FO.p=t0+d*(1-Math.pow(1-u,3));wd();if(u<1)requestAnimationFrame(f);else fa(FO.l[((FO.p%n)+n)%n])};f(s)}
function fa(c){const s=FO.f=='v'?'t':'v';if(FO.f=='t')sayT(c);$('#wa').innerHTML=tr(TB);$('#fb').style.display='none';
 tin(c,s,ok=>{grade(c,ok,0);if(ok){FO.s++;$('#sc').textContent='⭐ '+FO.s}else{$('#h'+(FO.h-1))?.classList.add('pop');FO.h--}},()=>{if(FO.h<1)return fe();$('#wa').innerHTML='';$('#fb').style.display='';FO.b=0})}
function fe(){ovShow(`<div class="hd"><button class="ib gl" onclick="closeOv()">✕</button><span>Фортуна</span><span class="cn"></span></div><div class="mid c"><h2>Игра окончена</h2><p class="mu">Верных ответов: ${FO.s}</p><button class="bt" onclick="fort()">Играть снова</button><button class="bt gl" style="color:var(--tx)" onclick="closeOv()">Закрыть</button></div>`)}

/* ---- карточки ---- */
let qs='';

function vCards(){
 const mn=`<button class="ib gl" onclick="menu()">☰</button>`;
 if(!S.decks.length)return`<div class="th"><h1>Карточки</h1>${mn}</div><div class="gl p c"><p>Здесь появятся ваши слова.</p><button class="bt" onclick="addDeck()">Добавить колоду</button></div>`;
 return`<div class="th"><h1>Все карточки</h1>${mn}</div>${chips()}<input class="in gl" placeholder="Поиск карточек" value="${esc(qs)}" oninput="qs=this.value;lst()"><div class="gl" id="ls">${rows(flt())}</div>`}

const cl=()=>{clearTimeout(lp);p0=0;document.querySelectorAll('.pr').forEach(r=>r.classList.remove('pr'))};
